<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render Strategy</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, sans-serif;
        background: #13151a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
        padding: 40px 16px;
      }

      header { text-align: center; }

      h1 {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      h1 span { color: #6366f1; }

      header p {
        margin-top: 8px;
        color: #94a3b8;
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        width: 100%;
        max-width: 900px;
      }

      .card {
        background: #1e2130;
        border: 1px solid #2d3148;
        border-radius: 12px;
        padding: 28px 24px;
        text-decoration: none;
        color: inherit;
        transition: border-color 0.2s, transform 0.2s;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .card:hover {
        border-color: #6366f1;
        transform: translateY(-2px);
      }

      .card__badge {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: #6366f120;
        color: #818cf8;
        border: 1px solid #6366f140;
        border-radius: 4px;
        padding: 2px 8px;
        width: fit-content;
      }

      .card__title {
        font-size: 1.15rem;
        font-weight: 700;
      }

      .card__desc {
        font-size: 0.85rem;
        color: #94a3b8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Render <span>Strategy</span></h1>
      <p>Comparativo de estratégias de renderização com Angular e React</p>
    </header>

    <main class="grid">
      <a class="card" href="/csr-angular/">
        <span class="card__badge">CSR</span>
        <span class="card__title">CSR — Angular</span>
        <p class="card__desc">Client-Side Rendering com Angular. Todo o HTML é gerado no browser após o download do JavaScript.</p>
      </a>
    </main>
  </body>
</html>
